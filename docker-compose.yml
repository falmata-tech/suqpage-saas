services:
  suqpage:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL to the production HTTPS URL}
        SUQPAGE_SERVER_ACTION_ORIGINS: ${SUQPAGE_SERVER_ACTION_ORIGINS:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      SUQPAGE_SERVER_ACTION_ORIGINS: ${SUQPAGE_SERVER_ACTION_ORIGINS:-}
      SUQPAGE_DATABASE_DRIVER: postgres
      SUQPAGE_POSTGRES_URL: ${SUQPAGE_POSTGRES_URL:?Set the PostgreSQL transaction-pooler URL}
      SUQPAGE_POSTGRES_POOL_MAX: ${SUQPAGE_POSTGRES_POOL_MAX:-4}
      SUQPAGE_POSTGRES_CONNECTION_TIMEOUT_MS: ${SUQPAGE_POSTGRES_CONNECTION_TIMEOUT_MS:-5000}
      SUQPAGE_POSTGRES_STATEMENT_TIMEOUT_MS: ${SUQPAGE_POSTGRES_STATEMENT_TIMEOUT_MS:-8000}
      SUQPAGE_MEDIA_ROOT: /data/media
      SUQPAGE_MEDIA_DRIVER: supabase
      SUQPAGE_SUPABASE_URL: ${SUQPAGE_SUPABASE_URL:?Set the Supabase project URL}
      SUQPAGE_SUPABASE_SERVICE_ROLE_KEY: ${SUQPAGE_SUPABASE_SERVICE_ROLE_KEY:?Set the server-only Supabase service role key}
      SUQPAGE_SUPABASE_STORAGE_BUCKET: ${SUQPAGE_SUPABASE_STORAGE_BUCKET:-mirtpage-media}
      SUQPAGE_AUTH_DRIVER: ${SUQPAGE_AUTH_DRIVER:-local}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      SUQPAGE_GOOGLE_AUTH_ENABLED: ${SUQPAGE_GOOGLE_AUTH_ENABLED:-0}
      SUQPAGE_BACKUP_ROOT: /data/backups
      PRIVACY_SALT: ${PRIVACY_SALT}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-}
      SUQPAGE_TELEGRAM_BOT_TOKEN: ${SUQPAGE_TELEGRAM_BOT_TOKEN:-}
      SUQPAGE_TELEGRAM_SUPPORT_CHAT_ID: ${SUQPAGE_TELEGRAM_SUPPORT_CHAT_ID:-}
      SUQPAGE_SUPPORT_WHATSAPP_URL: ${SUQPAGE_SUPPORT_WHATSAPP_URL:-}
    volumes:
      - suqpage_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  suqpage_data:
    # Preserve an existing named volume during the service-name upgrade.
    name: ${SUQPAGE_DATA_VOLUME:-suqpage-saas_mirtpage_data}
