services:
  mirtpage:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL to the production HTTPS URL}
        MIRTPAGE_SERVER_ACTION_ORIGINS: ${MIRTPAGE_SERVER_ACTION_ORIGINS:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      MIRTPAGE_SERVER_ACTION_ORIGINS: ${MIRTPAGE_SERVER_ACTION_ORIGINS:-}
      MIRTPAGE_DATABASE_DRIVER: postgres
      MIRTPAGE_POSTGRES_URL: ${MIRTPAGE_POSTGRES_URL:?Set the PostgreSQL transaction-pooler URL}
      MIRTPAGE_POSTGRES_POOL_MAX: ${MIRTPAGE_POSTGRES_POOL_MAX:-4}
      MIRTPAGE_POSTGRES_CONNECTION_TIMEOUT_MS: ${MIRTPAGE_POSTGRES_CONNECTION_TIMEOUT_MS:-5000}
      MIRTPAGE_POSTGRES_STATEMENT_TIMEOUT_MS: ${MIRTPAGE_POSTGRES_STATEMENT_TIMEOUT_MS:-8000}
      MIRTPAGE_MEDIA_ROOT: /data/media
      MIRTPAGE_MEDIA_DRIVER: supabase
      MIRTPAGE_SUPABASE_URL: ${MIRTPAGE_SUPABASE_URL:?Set the Supabase project URL}
      MIRTPAGE_SUPABASE_SERVICE_ROLE_KEY: ${MIRTPAGE_SUPABASE_SERVICE_ROLE_KEY:?Set the server-only Supabase service role key}
      MIRTPAGE_SUPABASE_STORAGE_BUCKET: ${MIRTPAGE_SUPABASE_STORAGE_BUCKET:-mirtpage-media}
      MIRTPAGE_AUTH_DRIVER: ${MIRTPAGE_AUTH_DRIVER:-local}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      MIRTPAGE_GOOGLE_AUTH_ENABLED: ${MIRTPAGE_GOOGLE_AUTH_ENABLED:-0}
      MIRTPAGE_BACKUP_ROOT: /data/backups
      PRIVACY_SALT: ${PRIVACY_SALT}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-}
      MIRTPAGE_TELEGRAM_BOT_TOKEN: ${MIRTPAGE_TELEGRAM_BOT_TOKEN:-}
      MIRTPAGE_TELEGRAM_SUPPORT_CHAT_ID: ${MIRTPAGE_TELEGRAM_SUPPORT_CHAT_ID:-}
      MIRTPAGE_SUPPORT_WHATSAPP_URL: ${MIRTPAGE_SUPPORT_WHATSAPP_URL:-}
    volumes:
      - mirtpage_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  mirtpage_data:
