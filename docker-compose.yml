services:
  suqpage:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL to the production HTTPS URL}
        SUQPAGE_SERVER_ACTION_ORIGINS: ${SUQPAGE_SERVER_ACTION_ORIGINS:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      SUQPAGE_SERVER_ACTION_ORIGINS: ${SUQPAGE_SERVER_ACTION_ORIGINS:-}
      SUQPAGE_DB_PATH: /data/suqpage.db
      SUQPAGE_MEDIA_ROOT: /data/media
      SUQPAGE_BACKUP_ROOT: /data/backups
      PRIVACY_SALT: ${PRIVACY_SALT}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-}
      SUQPAGE_TELEGRAM_BOT_TOKEN: ${SUQPAGE_TELEGRAM_BOT_TOKEN:-}
      SUQPAGE_TELEGRAM_SUPPORT_CHAT_ID: ${SUQPAGE_TELEGRAM_SUPPORT_CHAT_ID:-}
      SUQPAGE_SUPPORT_WHATSAPP_URL: ${SUQPAGE_SUPPORT_WHATSAPP_URL:-}
    volumes:
      - suqpage_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  suqpage_data:
