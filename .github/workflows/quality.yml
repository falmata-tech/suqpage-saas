name: Quality and specification gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-fixture
          POSTGRES_DB: suqpage_tests
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SUQPAGE_DATABASE_DRIVER: postgres
      SUQPAGE_TEST_POSTGRES_URL: postgresql://postgres:isolated-ci-fixture@127.0.0.1:5432/suqpage_tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - run: SUQPAGE_INSTALL_TARGET=web npm ci --workspace=@africmade/contracts --include-workspace-root
      - run: npm run test:workflow
      - run: npm run test:business-transport
      - run: npm run release:web
        env:
          SUQPAGE_DELEGATE_PROVIDER_SMOKE: "1"
      - run: npm run test:operations
      - run: npm run test:mobile:release-safety

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.111.0
      - run: npm ci
      - name: Native dependency compatibility
        run: node scripts/test-mobile-dependencies.cjs
      - run: npx playwright install --with-deps chromium
      - name: Business transport UI regression
        run: >-
          node --import tsx --test --test-concurrency=1
          scripts/test-browser-clipboard.ts
          scripts/test-public-transport-launcher.ts
          scripts/test-mobile-public-action-dock.ts
          scripts/test-mobile-market-layout.ts
          scripts/test-floating-inquiry-web.ts
          scripts/test-about-audiences.ts
          scripts/test-mobile-account-hub.ts
          scripts/test-mobile-owner-transport.ts
          scripts/test-chat-assignment-state.ts
          scripts/test-chat-inactivity-ui.ts
          scripts/test-client-chat-state-ui.ts
          scripts/test-native-transport-plan.ts
          scripts/test-participant-transport-plan.ts
          scripts/test-transport-storage-ui.ts
          scripts/test-transport-chat-layout.ts
          scripts/test-transport-coordinator-ui.ts
          scripts/test-owner-transport-workspace.ts
          scripts/test-tracking-portal-ui.ts
      - run: npm run test:acceptance
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: business-transport-browser-review
          path: test-results/**/workflow/*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-failure-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: npm run test:container

  dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - run: SUQPAGE_INSTALL_TARGET=web npm ci --workspace=@africmade/contracts --include-workspace-root
      - run: node scripts/check-web-install.cjs
      - run: npm audit --workspace=@africmade/contracts --include-workspace-root --audit-level=moderate

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: npm run test:postgres-readiness
