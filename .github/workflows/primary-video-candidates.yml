name: Finite primary-source video review

on:
  pull_request:
    paths: ['.github/workflows/primary-video-candidates.yml', 'scripts/review-primary-video-candidates.mjs']

permissions:
  contents: read

concurrency:
  group: primary-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-playback:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: npm run check:workflow-scripts -- scripts/review-primary-video-candidates.mjs
      - run: node scripts/review-primary-video-candidates.mjs --preflight
      - run: npx playwright install --with-deps chromium
      - name: Play exact creator videos in Chrome
        run: node scripts/review-primary-video-candidates.mjs
        env:
          GITHUB_SHA_HEAD: ${{ github.event.pull_request.head.sha }}
      - name: Retain run status
        if: always()
        run: |
          mkdir -p .local/primary-video-review
          printf '{"job":"%s","source":"%s","run":"%s"}\n' '${{ job.status }}' '${{ github.event.pull_request.head.sha }}' '${{ github.run_id }}' > .local/primary-video-review/run-receipt.json
      - name: Retain finite visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: primary-video-review
          path: |
            .local/primary-video-review/*.json
            .local/primary-video-review/*.png
          if-no-files-found: error
          retention-days: 7
