name: Finite showroom source batch review

on:
  pull_request:
    paths: ['.github/workflows/showroom-source-batch.yml', 'scripts/review-showroom-source-batch.mjs', 'scripts/qa/s197-showroom-source-batch.json']

permissions:
  contents: read

concurrency:
  group: showroom-source-batch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      S197_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: npm run check:workflow-scripts -- scripts/review-showroom-source-batch.mjs
      - run: npx playwright install --with-deps chromium
      - name: Decode original creator clips and retain frames
        run: node scripts/review-showroom-source-batch.mjs
      - name: Retain source-bound review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s197-showroom-source-batch
          path: .local/s197-showroom-source-batch/
          if-no-files-found: error
          retention-days: 7
