<!doctype html>
<html lang="en">
  <head><meta name="viewport" content="width=device-width, initial-scale=1"><title>AfricMade</title></head>
  <body style="margin:0;background:#f4f4f2;color:#202428;font-family:Arial,Helvetica,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;background:#f4f4f2">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="width:100%;max-width:520px;background:#ffffff;border:1px solid #d9dcde">
            <tr><td style="height:6px;background:#ff4b00"></td></tr>
            <tr>
              <td style="padding:24px">
                <p style="margin:0 0 24px"><img src="{{ .SiteURL }}/brand/africmade-wordmark-email-white-v1.png" alt="AfricMade" width="220" height="60" style="display:block;border:0;width:220px;height:60px;max-width:100%;background-color:#ffffff"></p>
                <h1 style="margin:0 0 12px;font-size:26px;line-height:1.2">Join AfricMade</h1>
                <p style="margin:0 0 24px;color:#5d6267;font-size:16px;line-height:1.5">You have been invited to create a AfricMade account.</p>
                <p style="margin:0"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 20px;background:#c93600;color:#ffffff;font-weight:700;text-decoration:none;border-radius:8px">Accept invitation</a></p>
                <p style="margin:24px 0 0;color:#777c80;font-size:13px;line-height:1.5">If you did not request this, you can ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
