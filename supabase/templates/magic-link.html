<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4f4f2;color:#202428;font-family:Arial,Helvetica,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;background:#f4f4f2">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:1px solid #d9dcde">
            <tr><td style="height:6px;background:#ff4b00"></td></tr>
            <tr>
              <td style="padding:32px">
                <p style="margin:0 0 24px;font-size:20px;font-weight:700">AfricMade</p>
                <h1 style="margin:0 0 12px;font-size:26px;line-height:1.2">Your sign-in code</h1>
                <p style="margin:0 0 24px;color:#5d6267;font-size:16px;line-height:1.5">Enter this six-digit code in AfricMade. It expires shortly and can be used only once.</p>
                <p style="margin:0;padding:16px;background:#202428;color:#ffffff;font-size:32px;font-weight:700;letter-spacing:6px;text-align:center">{{ .Token }}</p>
                <p style="margin:24px 0 0;color:#777c80;font-size:13px;line-height:1.5">If you did not request this code, you can ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
